<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Livella a Bolla</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f0f2f5; padding: 20px; text-align: center; color: #333; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; }
        .btn-back { background: #343a40; color: white; padding: 12px; font-size: 16px; border-radius: 8px; border: none; width: 100%; margin-bottom: 20px; font-weight: bold; cursor: pointer; }
        
        /* Struttura della livella */
        .level-wrapper {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #level-container {
            width: 250px;
            height: 250px;
            background: #2c3e50;
            border-radius: 50%;
            position: relative;
            border: 5px solid #bdc3c7;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        /* Il mirino centrale */
        #crosshair-x, #crosshair-y {
            position: absolute;
            background: rgba(255,255,255,0.2);
        }
        #crosshair-x { width: 100%; height: 2px; top: 50%; left: 0; transform: translateY(-50%); }
        #crosshair-y { width: 2px; height: 100%; top: 0; left: 50%; transform: translateX(-50%); }
        
        /* Il cerchio del bersaglio perfetto */
        #target-circle {
            width: 60px;
            height: 60px;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* La Bolla */
        #bubble {
            width: 56px;
            height: 56px;
            background: #e74c3c;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease-out, background 0.2s, box-shadow 0.2s;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.3);
        }

        .data-panel {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 1.2rem;
            font-weight: bold;
            color: #555;
        }
        .data-box { background: #ecf0f1; padding: 10px 15px; border-radius: 8px; width: 45%; }
        
        #permission-btn {
            background: #007bff; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 15px; display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <button class="btn-back" onclick="location.href='index.html'">🔙 Torna al Menù</button>
        
        <h1>📏 Livella</h1>
        <p style="color: #666; font-size: 0.9rem; margin-bottom: 20px;">Appoggia il telefono su una superficie piana.</p>

        <div class="level-wrapper">
            <div id="level-container">
                <div id="crosshair-x"></div>
                <div id="crosshair-y"></div>
                <div id="target-circle"></div>
                <div id="bubble"></div>
            </div>

            <div class="data-panel">
                <div class="data-box">X: <span id="x-val">0°</span></div>
                <div class="data-box">Y: <span id="y-val">0°</span></div>
            </div>
            
            <button id="permission-btn" onclick="requestPermission()">Abilita Sensori</button>
        </div>
    </div>

    <script>
        const bubble = document.getElementById('bubble');
        const xVal = document.getElementById('x-val');
        const yVal = document.getElementById('y-val');
        const permissionBtn = document.getElementById('permission-btn');

        // Controllo specifico per dispositivi iOS che richiedono l'autorizzazione manuale
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            permissionBtn.style.display = 'block';
        } else {
            window.addEventListener('deviceorientation', handleOrientation);
        }

        function requestPermission() {
            DeviceOrientationEvent.requestPermission()
                .then(response => {
                    if (response === 'granted') {
                        permissionBtn.style.display = 'none';
                        window.addEventListener('deviceorientation', handleOrientation);
                    } else {
                        alert("Permesso negato per i sensori di movimento.");
                    }
                })
                .catch(console.error);
        }

        function handleOrientation(event) {
            let x = event.gamma; // Inclinazione sinistra/destra [-90,90]
            let y = event.beta;  // Inclinazione fronte/retro [-180,180]

            // Se il telefono è capovolto, aggiusta i valori
            if (x === null || y === null) return;

            // Blocca i valori a 45 gradi per non far uscire la bolla dal cerchio
            let clampX = Math.max(-45, Math.min(45, x));
            let clampY = Math.max(-45, Math.min(45, y));

            xVal.innerText = Math.round(x) + "°";
            yVal.innerText = Math.round(y) + "°";

            // Calcola lo spostamento (Raggio contenitore = 125, Raggio bolla = 28 -> Max movimento ~95px)
            let maxMove = 95; 
            let moveX = (clampX / 45) * maxMove;
            let moveY = (clampY / 45) * maxMove;

            // Arrotonda la posizione per mantenere la bolla dentro il cerchio (Teorema di Pitagora)
            let distance = Math.sqrt(moveX * moveX + moveY * moveY);
            if (distance > maxMove) {
                let ratio = maxMove / distance;
                moveX *= ratio;
                moveY *= ratio;
            }

            bubble.style.transform = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px))`;

            // Colore dinamico: Verde se in piano (margine di errore 2 gradi), Rosso se storto
            if (Math.abs(x) <= 2 && Math.abs(y) <= 2) {
                bubble.style.background = "#2ecc71"; // Verde
                bubble.style.boxShadow = "0 0 20px #2ecc71, inset -5px -5px 10px rgba(0,0,0,0.2)";
                if (navigator.vibrate && Math.abs(x) === 0 && Math.abs(y) === 0) {
                    navigator.vibrate(50); // Vibrazione leggera se lo becchi a zero spaccato
                }
            } else {
                bubble.style.background = "#e74c3c"; // Rosso
                bubble.style.boxShadow = "inset -5px -5px 10px rgba(0,0,0,0.3)";
            }
        }
    </script>
</body>
</html>
