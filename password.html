<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore Password</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f0f2f5; padding: 20px; text-align: center; color: #333; }
        .container { max-width: 350px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .password-box { background: #2d3436; color: #00d2d3; font-size: 1.5rem; padding: 15px; border-radius: 8px; margin-bottom: 20px; word-break: break-all; letter-spacing: 2px; }
        .controls { text-align: left; margin-bottom: 20px; }
        .controls label { display: block; margin-bottom: 10px; font-size: 1.1rem; }
        button { padding: 12px; font-size: 16px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .btn-generate { background: #007bff; color: white; }
        .btn-copy { background: #2ecc71; color: white; }
        .btn-back { background: #343a40; color: white; width: 100%; max-width: 350px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <button class="btn-back" onclick="location.href='index.html'">🔙 Torna al Menù</button>

    <div class="container">
        <h1>🔐 Generatore Password</h1>
        
        <div class="password-box" id="passwordOutput">••••••••</div>

        <div class="controls">
            <label>Lunghezza: <span id="lunghezzaVal">12</span>
                <input type="range" id="lunghezza" min="8" max="32" value="12" oninput="document.getElementById('lunghezzaVal').innerText = this.value" style="width: 100%;">
            </label>
            <label><input type="checkbox" id="incNumeri" checked> Includi Numeri (0-9)</label>
            <label><input type="checkbox" id="incSimboli" checked> Includi Simboli (!@#$)</label>
            <label><input type="checkbox" id="incMaiuscole" checked> Includi Maiuscole (A-Z)</label>
        </div>

        <button class="btn-generate" onclick="generaPassword()">🔄 Genera Nuova</button>
        <button class="btn-copy" onclick="copiaPassword()">📋 Copia Password</button>
    </div>

    <script>
        function generaPassword() {
            const lunghezza = document.getElementById('lunghezza').value;
            const incNumeri = document.getElementById('incNumeri').checked;
            const incSimboli = document.getElementById('incSimboli').checked;
            const incMaiuscole = document.getElementById('incMaiuscole').checked;

            const minuscole = "abcdefghijklmnopqrstuvwxyz";
            const maiuscole = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const numeri = "0123456789";
            const simboli = "!@#$%^&*()_+~`|}{[]:;?><,./-=";

            let caratteriPossibili = minuscole;
            if (incMaiuscole) caratteriPossibili += maiuscole;
            if (incNumeri) caratteriPossibili += numeri;
            if (incSimboli) caratteriPossibili += simboli;

            let password = "";
            for (let i = 0; i < lunghezza; i++) {
                const randomIndex = Math.floor(Math.random() * caratteriPossibili.length);
                password += caratteriPossibili[randomIndex];
            }

            document.getElementById('passwordOutput').innerText = password;
        }

        function copiaPassword() {
            const pw = document.getElementById('passwordOutput').innerText;
            if (pw === "••••••••") return;
            
            navigator.clipboard.writeText(pw).then(() => {
                const btn = document.querySelector('.btn-copy');
                btn.innerText = "✅ Copiata!";
                btn.style.background = "#27ae60";
                setTimeout(() => {
                    btn.innerText = "📋 Copia Password";
                    btn.style.background = "#2ecc71";
                }, 2000);
            });
        }

        // Genera una all'avvio
        generaPassword();
    </script>
</body>
</html>
