<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Conteggio Registrazione Dispositivi</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #f5f6fa;
            padding: 20px;
            text-align: center;
        }
        h1, h2, h3 {
            color: #333;
        }
        input, select, button {
            margin: 10px;
            padding: 10px;
            font-size: 18px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        button {
            cursor: pointer;
            background-color: #3498db;
            color: white;
            width: auto;
        }
        button:hover {
            background-color: #2980b9;
        }
        .counter {
            font-size: 24px;
            margin: 15px;
        }
        .device-container {
            margin-top: 20px;
        }
        #totaleFinale, #resocontoFinale {
            margin-top: 30px;
            font-size: 22px;
            color: #e74c3c;
            font-weight: bold;
            white-space: pre-wrap; /* Permette di andare a capo correttamente nel resoconto */
        }
        
        /* --- NUOVO LAYOUT ALLINEATO PER I DATI FINALI --- */
        .input-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            max-width: 450px;
            margin: 0 auto 15px auto;
        }
        .input-row label {
            text-align: right;
            margin-right: 15px;
            font-size: 16px;
            font-weight: bold;
            flex: 1;
        }
        .input-row input, .input-row select {
            width: 120px;
            margin: 0;
            text-align: center;
        }
    </style>
</head>
<body>

    <button onclick="location.href='index.html'">🔙 Torna al Menù</button>
    <h1>📦 Registrazione Dispositivi</h1>

    <div id="setup">
        <p>Quanti dispositivi devi registrare in totale?</p>
        <input type="number" id="totaleDispositivi" placeholder="Totale dispositivi">
        <p>Quanti sono Hilo?</p>
        <input type="number" id="hiloDispositivi" placeholder="Numero Hilo">
        <p>Quanti sono Hilo Plus?</p>
        <input type="number" id="hiloPlusDispositivi" placeholder="Numero Hilo Plus">
        <br><br>
        <button id="iniziaBtn">Inizia</button>
    </div>

    <div id="conteggio" style="display: none;">
        <h2>📋 Gestisci Registrazioni</h2>
        <div class="device-container">
            <h3>HILO</h3>
            <button onclick="modifica('hilo', -1)">➖</button>
            <span class="counter" id="contatoreHilo">0</span>
            <button onclick="modifica('hilo', 1)">➕</button>
        </div>
        <div class="device-container">
            <h3>HILO PLUS</h3>
            <button onclick="modifica('hiloPlus', -1)">➖</button>
            <span class="counter" id="contatoreHiloPlus">0</span>
            <button onclick="modifica('hiloPlus', 1)">➕</button>
        </div>
        <div id="totaleFinale">
            🔥 Dispositivi da registrare: <span id="contatoreTotale">0</span>
        </div>
        <button onclick="reset()">🔄 Reset App</button>
    </div>
